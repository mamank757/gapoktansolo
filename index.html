<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Data Petani – ERDKK 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5EE;--surface:#fff;--ink:#17261B;--muted:#586A5C;--line:#D5DECF;--brand:#1F5A32;--on-brand:#fff;--warn-bg:#FFF1CC;--warn-ink:#6B4A00;--ok-bg:#D8F0DC;--ok-ink:#11521F;--chip:#E6EDDF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1912;--surface:#17241B;--ink:#E8F0E9;--muted:#9DB0A1;--line:#2B3D30;--brand:#2E7A47;--on-brand:#fff;--warn-bg:#3A2E0C;--warn-ink:#F3D27A;--ok-bg:#17402A;--ok-ink:#A6E3B6;--chip:#223127}}
:root[data-theme="dark"]{--bg:#0F1912;--surface:#17241B;--ink:#E8F0E9;--muted:#9DB0A1;--line:#2B3D30;--brand:#2E7A47;--on-brand:#fff;--warn-bg:#3A2E0C;--warn-ink:#F3D27A;--ok-bg:#17402A;--ok-ink:#A6E3B6;--chip:#223127}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:var(--on-brand);padding:28px 0 22px}
h1{margin:0 0 6px;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15;font-weight:800;letter-spacing:-.01em}
header p{margin:0;opacity:.9;font-size:.98rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);padding:0 0 16px}
.search{display:flex;align-items:center;background:var(--surface);border-radius:14px;border:2px solid transparent;padding:0 14px;gap:10px}
.search:focus-within{border-color:#E3B23C}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:600 1.15rem "Plus Jakarta Sans",system-ui,sans-serif;padding:16px 0;outline:none}
.search input::placeholder{color:var(--muted);font-weight:400}
.clear{border:0;background:var(--chip);color:var(--ink);border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:none}
.clear.on{display:block}
:focus-visible{outline:3px solid #E3B23C;outline-offset:2px}
.gh{margin:16px 0 0}
.back{border:0;background:none;color:var(--ink);font:700 1rem "Plus Jakarta Sans",system-ui,sans-serif;padding:8px 0;cursor:pointer;text-decoration:underline}
h2{margin:2px 0 0;font-size:1.5rem;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
li.gl{display:block;padding:0;position:relative}
.grp{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:16px;cursor:pointer;border-radius:12px}
.grp:active{background:var(--chip)}
.gn{font-weight:800;font-size:1.15rem;overflow-wrap:anywhere}
.gm{grid-column:1;color:var(--muted);font-size:.93rem}
.ch{grid-column:2;grid-row:1/3;font-size:1.8rem;line-height:1;color:var(--muted)}

/* --- Style Tambahan --- */
.dl-wrap{padding:0 16px 16px;margin-top:-6px}
.dl-link{display:inline-block;background:var(--ok-bg);color:var(--ok-ink);padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:700;text-decoration:none;border:1px solid rgba(17, 82, 31, 0.2)}
.dl-link:active{opacity:.7}
.cta-lihat{display:inline-block;margin-top:6px;color:#fff;background:var(--brand);padding:4px 8px;border-radius:6px;font-weight:700;font-size:.85rem}
/* ---------------------- */

.count{margin:12px 0;color:var(--muted);font-size:.92rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.nm{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.ha{text-align:right;font-weight:800;font-size:1.1rem;white-space:nowrap}
.ha small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:.93rem}
.jab{background:var(--chip);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:600}
.jab.pj{background:#E3B23C;color:#3A2A00}
.st{grid-column:1/-1;margin-top:6px;border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.st.no{background:var(--warn-bg);color:var(--warn-ink)}
.st.ok{background:var(--ok-bg);color:var(--ok-ink)}
mark{background:#F6D76B;color:#2A2000;border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.more{display:block;width:100%;margin:14px 0 0;padding:14px;border-radius:12px;border:2px solid var(--brand);background:none;color:var(--ink);font:800 1rem "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
footer{padding:26px 0 40px;color:var(--muted);font-size:.82rem}

/* --- Style Tambahan untuk Animasi Loading --- */
.loading-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 0;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 4px solid var(--chip);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.loading-text {
  animation: pulse 1.5s ease-in-out infinite alternate;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  from { opacity: 0.6; }
  to { opacity: 1; }
}
/* ------------------------------------------- */
</style>
</head>
<body>
<header><div class="wrap">
<h1>Cek Data Petani<br>di SIMLUHTAN</h1>
<p id="sub">Gapoktan (Gabungan Kelompok Tani) - Kelurahan Solo</p>
</div></header>
<div class="bar"><div class="wrap">
<div class="search" role="search">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="Ketik nama petani…" autocomplete="off" aria-label="Cari nama petani">
<button class="clear" id="x" aria-label="Hapus pencarian">×</button>
</div></div></div>
<main class="wrap">
<div class="gh" id="gh" hidden><button class="back" id="back">‹ Kembali ke daftar kelompok</button><h2 id="gt"></h2></div>
<p class="count" id="cnt" aria-live="polite"></p>

<!-- Tampilan Loading Diperbarui Di Sini -->
<ul id="list">
  <li class="empty" style="display:block">
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="loading-text">
        <strong>Silakan Tunggu</strong><br>Sedang Mengambil Data Kelompok...
      </div>
    </div>
  </li>
</ul>
<!-- ==================================== -->

<button class="more" id="more" hidden></button>
<footer>Data sesuai SIMLUHTAN (Sistem Penyuluh Pertanian). Jika data Anda keliru atau belum muncul, hubungi penyuluh.</footer>
</main>
<script>
const $=id=>document.getElementById(id),PAGE=40;
let shown=PAGE,rows=[],D=null,grp=null,groups=[];
function start(d){D=d;
 rows=D.r.map(r=>({n:r[0],p:D.p[r[1]],pi:r[1],j:D.j[r[2]],l:r[3],s:D.s[r[4]],k:(r[0]+' '+D.p[r[1]]).toLowerCase()}));
 groups=D.p.map((name,i)=>({name,i,n:rows.filter(r=>r.pi===i).length})).sort((a,b)=>a.name.localeCompare(b.name,'id',{numeric:true}));
 $('sub').textContent='Gapoktan (Gabungan Kelompok Tani) - Kelurahan Solo · '+rows.length.toLocaleString('id-ID')+' petani dari '+D.p.length+' kelompok tani';
 render();}

// ====== PENGATURAN ======
// 1. Link Web App Apps Script (API URL)
const API_URL='https://script.google.com/macros/s/AKfycbw7uU4pzpq1D6866HOao3hDkEN9N0B-VDAcnu2adW6dfmGQy-v5qzgb3mFfFZLRU-Bf/exec';

// 2. Daftar Link Download ERDKK Masing-masing Kelompok
const LINK_DOWNLOAD = {
  "BULOE": "https://github.com/mamank757/gapoktansolo/raw/0ffdbcc1938e38ab55b58d66b7e1d5bc8fbdce96/BULOE.pdf",
  "DEWI SRI": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/DEWI%20SRI.pdf",
  "IRE'E": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/IRE'E.pdf",
  "JANGKALI": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/JANGKALI.pdf",
  "JANGKALI I": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/JANGKALI%20I.pdf",
  "KARYA TANI": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/KARYA%20TANI.pdf",
  "MABBALENNAE": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/MABBALENNAE.pdf",
  "MAJU BERSAMA": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/MAJU%20BERSAMA.pdf",
  "MALOMOE": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/MALOMOE.pdf",
  "MEGA BUANA": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/MEGA%20BUANA.pdf",
  "MEGA RENNU": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/MEGA%20RENNU.pdf",
  "PALLA BESSI": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/PALLA%20BESSI.pdf",
  "PALLABESSI MACCOLLI LOLOE": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/PALLABESSI%20MACCOLLI%20LOLOE.pdf",
  "PITUJU": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/PITUJU.pdf",
  "SIPATUO": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/SIPATUO.pdf",
  "SOLO I": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/SOLO%20I.pdf",
  "SOLO II": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/SOLO%20II.pdf",
  "SOLO III": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/SOLO%20III.pdf",
  "TAWAROE": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/TAWAROE.pdf",
  "WAETUO": "https://github.com/mamank757/gapoktansolo/raw/084ab2261fb254a562a7161fb053f01300e27ef1/WAETUO.pdf"
};
// ========================

function fail(msg){$('list').innerHTML='<li class="empty" style="display:block"><strong>Data belum bisa dimuat.</strong><br>'+msg+'</li>'}
async function load(){
 if(!API_URL){fail('Link Apps Script (API_URL) di file index.html belum diisi.');return}
 try{const res=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now());if(!res.ok)throw 0;
  const d=await res.json();if(!d.r||!d.r.length)throw 0;start(d)}
 catch(e){fail('Periksa sambungan internet lalu muat ulang halaman ini.')}
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t,re){return re?t.split(re).map((x,i)=>i%2?'<mark>'+esc(x)+'</mark>':esc(x)).join(''):esc(t)}

function render(){
 if(!D)return;
 const q=$('q').value.trim().toLowerCase(),tk=q?q.split(/\s+/):[];
 $('x').classList.toggle('on',!!q);
 $('gh').hidden=grp===null;
 $('q').placeholder=grp===null?'Ketik nama petani…':'Cari nama di kelompok ini…';
 if(grp!==null)$('gt').textContent=D.p[grp];
 
 if(grp===null&&!tk.length){
  $('cnt').textContent=groups.length+' kelompok tani. Pilih kelompok Anda, atau ketik nama untuk mencari.';
  // Modifikasi: Menambahkan tombol link download & teks "Lihat Data di Simluhtan"
  $('list').innerHTML=groups.map(g=>{
    const link = LINK_DOWNLOAD[g.name] || '#';
    return '<li class="gl"><button class="grp" data-i="'+g.i+'"><span class="gn">'+esc(g.name)+'</span><span class="ch" aria-hidden="true">›</span>'
         + '<span class="gm">'+g.n+' petani<br><span class="cta-lihat">➡️ Lihat Data di Simluhtan</span></span></button>'
         + '<div class="dl-wrap"><a href="'+link+'" target="_blank" class="dl-link">⬇ Download ERDKK 2026</a></div></li>'
  }).join('');
  $('more').hidden=true;return}
  
 const re=tk.length?new RegExp('('+tk.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'):null;
 const res=rows.filter(r=>(grp===null||r.pi===grp)&&tk.every(t=>r.k.includes(t)));
 $('cnt').textContent=res.length?'Menampilkan '+Math.min(shown,res.length)+' dari '+res.length+' petani':'';
 $('list').innerHTML=res.length?res.slice(0,shown).map(r=>{
  const ok=/^(sudah|terdaftar)/i.test(r.s);
  return '<li><span class="nm">'+hl(r.n,re)+'</span><span class="ha">'+r.l.toLocaleString('id-ID',{maximumFractionDigits:2})+' ha<small>luas lahan</small></span>'
  +'<span class="meta">'+hl(r.p,re)+' <span class="jab'+(r.j!=='Anggota'?' pj':'')+'">'+esc(r.j)+'</span></span><span></span>'
  +'<div class="st '+(ok?'ok':'no')+'"><span aria-hidden="true">'+(ok?'✔':'⏳')+'</span><span>ERDKK 2027: '+esc(r.s)+'</span></div></li>'}).join('')
  :'<li class="empty" style="display:block"><strong>Nama tidak ditemukan.</strong><br>Coba tulis sebagian nama saja atau periksa ejaannya.</li>';
 const left=res.length-shown;$('more').hidden=left<=0;$('more').textContent='Tampilkan '+Math.min(PAGE,left)+' lagi';
}

let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{shown=PAGE;render()},120)});
$('x').onclick=()=>{$('q').value='';shown=PAGE;render();$('q').focus()};
$('more').onclick=()=>{shown+=PAGE;render()};
$('list').addEventListener('click',e=>{const b=e.target.closest('.grp');if(!b)return;
 grp=+b.dataset.i;shown=PAGE;history.pushState({g:grp},'');window.scrollTo(0,0);render()});
$('back').onclick=()=>history.back();
addEventListener('popstate',e=>{grp=e.state&&e.state.g!=null?e.state.g:null;shown=PAGE;render()});
load();
</script>
</body>
</html>
